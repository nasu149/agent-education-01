name: CI

on:
  push:
    branches: ["instructor-ready", "student-complete"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: agent/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r agent/requirements.txt
      - run: python -m compileall -q agent/src
      - run: pytest -q agent/tests

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -q -f member-app/pom.xml package -DskipTests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config >/dev/null
      - run: docker compose build

  web-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start the real web stack
        run: docker compose up -d --build postgres tomcat httpd
      - name: Verify proxy, Servlet, PostgreSQL and recovery
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              echo "===== docker compose ps ====="
              docker compose ps || true
              echo "===== PostgreSQL direct check ====="
              docker compose exec -T postgres psql -U memberapp -d memberdb -c 'select id,name,email from members order by id;' || true
              echo "===== HTTP response ====="
              curl -sS -i http://localhost:8088/api/members || true
              echo
              echo "===== Tomcat database failures ====="
              docker compose logs --no-color tomcat 2>&1 | grep -A12 -B4 -E 'Database failure|SQLException|PSQLException|ERROR|Exception' || true
              echo "===== docker compose logs ====="
              docker compose logs --no-color || true
            fi
            docker compose down -v --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT

          echo "Waiting for Browser -> httpd -> Tomcat -> PostgreSQL path..."
          ready=0
          for _ in $(seq 1 30); do
            status=$(curl -sS -o /tmp/members.json -w '%{http_code}' http://localhost:8088/api/members || true)
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            echo "Current HTTP status: $status"
            if [ -s /tmp/members.json ]; then
              echo "Response body:"
              cat /tmp/members.json
              echo
            fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -q 'tanaka@example.local' /tmp/members.json

          echo "Verifying a real CRUD request through httpd and Servlet..."
          curl -fsS \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI User","department":"QA","email":"ci-user@example.local"}' \
            http://localhost:8088/api/members > /tmp/create.json
          curl -fsS http://localhost:8088/api/members > /tmp/members-after-create.json
          grep -q 'ci-user@example.local' /tmp/members-after-create.json

          echo "Verifying that stopping Tomcat is externally observable..."
          docker compose stop tomcat
          sleep 2
          if curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
            echo "Expected application failure after Tomcat stop, but request succeeded." >&2
            exit 1
          fi

          echo "Verifying recovery after Tomcat start..."
          docker compose start tomcat
          recovered=0
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
              recovered=1
              break
            fi
            sleep 2
          done
          test "$recovered" -eq 1
