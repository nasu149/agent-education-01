name: CI

on:
  push:
    branches: ["instructor-ready", "student-complete", "training/team-agent-battle", "training/team-agent-battle-solution", "experiment/disk-full"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: agent/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r agent/requirements.txt
      - run: python -m compileall -q agent/src
      - run: pytest -q agent/tests

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -q -f member-app/pom.xml package -DskipTests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config >/dev/null
      - run: docker compose build

  web-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start the real web stack
        run: docker compose up -d --build postgres tomcat httpd
      - name: Verify proxy, Servlet, PostgreSQL and recovery
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              echo "===== docker compose ps ====="
              docker compose ps || true
              echo "===== PostgreSQL direct check ====="
              docker compose exec -T postgres psql -U postgres -d memberdb -c 'select id,name,email from members order by id;' || true
              echo "===== HTTP response ====="
              curl -sS -i http://localhost:8088/api/members || true
              echo
              echo "===== Tomcat database failures ====="
              docker compose logs --no-color tomcat 2>&1 | grep -A12 -B4 -E 'Database failure|SQLException|PSQLException|ERROR|Exception' || true
              echo "===== docker compose logs ====="
              docker compose logs --no-color || true
            fi
            docker compose down -v --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT

          echo "Waiting for Browser -> httpd -> Tomcat -> PostgreSQL path..."
          ready=0
          for _ in $(seq 1 30); do
            status=$(curl -sS -o /tmp/members.json -w '%{http_code}' http://localhost:8088/api/members || true)
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            echo "Current HTTP status: $status"
            if [ -s /tmp/members.json ]; then
              echo "Response body:"
              cat /tmp/members.json
              echo
            fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -q 'tanaka@example.local' /tmp/members.json

          echo "Verifying a real CRUD request through httpd and Servlet..."
          curl -fsS \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI User","department":"QA","email":"ci-user@example.local"}' \
            http://localhost:8088/api/members > /tmp/create.json
          curl -fsS http://localhost:8088/api/members > /tmp/members-after-create.json
          grep -q 'ci-user@example.local' /tmp/members-after-create.json

          echo "Verifying that stopping Tomcat is externally observable..."
          docker compose stop tomcat
          sleep 2
          if curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
            echo "Expected application failure after Tomcat stop, but request succeeded." >&2
            exit 1
          fi

          echo "Verifying recovery after Tomcat start..."
          docker compose start tomcat
          recovered=0
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
              recovered=1
              break
            fi
            sleep 2
          done
          test "$recovered" -eq 1

  connection-exhaustion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start normal application stack
        run: docker compose up -d --build postgres tomcat httpd
      - name: Verify connection-exhaustion incident and real MCP remediation
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              echo "===== compose ps ====="
              docker compose --profile fault ps || true
              echo "===== fault injector logs ====="
              docker compose --profile fault logs --no-color fault-injector || true
              echo "===== postgres logs ====="
              docker compose logs --no-color postgres || true
              echo "===== tomcat logs ====="
              docker compose logs --no-color tomcat || true
            fi
            docker compose --profile fault down -v --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT

          echo "Waiting for healthy application..."
          healthy=0
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" -eq 1

          echo "Starting non-superuser connection hog..."
          docker compose --profile fault up -d --build fault-injector

          failed=0
          for _ in $(seq 1 40); do
            if ! curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
              failed=1
              break
            fi
            sleep 1
          done
          test "$failed" -eq 1

          connection_count=$(docker compose exec -T postgres \
            psql -U postgres -d memberdb -Atc \
            "select count(*) from pg_stat_activity where usename='fault_injector' and application_name='fault-injector';")
          echo "fault-injector sessions before MCP remediation: $connection_count"
          test "$connection_count" -ge 10

          echo "Building Agent image and invoking the real MCP tools..."
          docker compose build agent
          docker compose run --rm --no-deps -T agent python - <<'PY'
          import asyncio

          from agent.mcp_tools import load_tool_catalog


          async def main():
              catalog = await load_tool_catalog()
              summary_tool = next(
                  tool for tool in catalog.read_only
                  if tool.name == "get_postgres_connection_summary"
              )
              summary = await summary_tool.ainvoke({})
              print("MCP connection summary:", summary)

              result = await catalog.mutating["terminate_postgres_connections"].ainvoke(
                  {"application_name": "fault-injector"}
              )
              print("MCP remediation result:", result)


          asyncio.run(main())
          PY

          remaining=$(docker compose exec -T postgres \
            psql -U postgres -d memberdb -Atc \
            "select count(*) from pg_stat_activity where usename='fault_injector' and application_name='fault-injector';")
          echo "fault-injector sessions after MCP remediation: $remaining"
          test "$remaining" -eq 0

          echo "The injector stays alive but does not reconnect; application should recover..."
          recovered=0
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
              recovered=1
              break
            fi
            sleep 1
          done
          test "$recovered" -eq 1


  disk-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start application with bounded Tomcat training disk
        run: docker compose up -d --build postgres tomcat httpd
      - name: Verify disk-full incident and real MCP remediation
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              echo "===== compose ps ====="
              docker compose ps || true
              echo "===== training disk ====="
              docker compose exec -T tomcat df -h /training-disk || true
              echo "===== training disk files ====="
              docker compose exec -T tomcat sh -c 'du -ak /training-disk 2>/dev/null | sort -nr | head -20' || true
              echo "===== tomcat logs ====="
              docker compose logs --no-color tomcat || true
            fi
            docker compose down -v --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT

          echo "Waiting for healthy application..."
          healthy=0
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 3 http://localhost:8088/api/members >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" -eq 1

          echo "Checking the bounded training filesystem..."
          docker compose exec -T tomcat df -h /training-disk
          size_kb=$(docker compose exec -T tomcat df -Pk /training-disk | awk 'NR==2 {print $2}')
          echo "training disk size_kb=$size_kb"
          test "$size_kb" -ge 12000
          test "$size_kb" -le 20000

          echo "Simulating overnight log growth until the training disk is full..."
          docker compose exec -T tomcat sh -c '
            mkdir -p /training-disk/archive /training-disk/audit
            dd if=/dev/zero of=/training-disk/audit/member-audit.log bs=4096 count=1 conv=notrunc status=none 2>/dev/null || true
            rm -f /training-disk/archive/training-old-audit.log
            dd if=/dev/zero of=/training-disk/archive/training-old-audit.log bs=1M count=128 status=none 2>/dev/null || true
            dd if=/dev/zero of=/training-disk/archive/training-old-audit.log bs=1K count=2048 oflag=append conv=notrunc status=none 2>/dev/null || true
            dd if=/dev/zero of=/training-disk/archive/training-old-audit.log bs=1 count=8192 oflag=append conv=notrunc status=none 2>/dev/null || true
          '

          use_percent=$(docker compose exec -T tomcat df -Pk /training-disk | awk 'NR==2 {gsub(/%/, "", $5); print $5}')
          echo "training disk use_percent=$use_percent"
          test "$use_percent" -ge 95

          echo "Application should now fail while all containers remain running..."
          status=$(curl -sS --max-time 5 -o /tmp/disk-full.json -w '%{http_code}'             http://localhost:8088/api/members || true)
          echo "HTTP status=$status"
          cat /tmp/disk-full.json || true
          test "$status" != "200"
          grep -q 'audit storage unavailable' /tmp/disk-full.json

          for service in postgres tomcat httpd; do
            docker compose ps --status running --services | grep -qx "$service"
          done

          echo "Tomcat should expose a useful disk-full clue..."
          docker compose logs --no-color tomcat | grep -E 'audit_write_failed|No space left on device'

          echo "Building Agent image and invoking real read-only disk tools..."
          docker compose build agent
          observation=$(
            docker compose run --rm --no-deps -T agent python - <<'PY'
          import asyncio

          from agent.mcp_tools import load_tool_catalog


          async def main():
              catalog = await load_tool_catalog()
              by_name = {tool.name: tool for tool in catalog.read_only}

              usage = await by_name["get_disk_usage"].ainvoke({"service": "tomcat"})
              files = await by_name["list_large_files"].ainvoke(
                  {"service": "tomcat", "limit": 10}
              )
              print("DISK_USAGE", usage)
              print("LARGE_FILES", files)


          asyncio.run(main())
          PY
          )
          echo "$observation"
          echo "$observation" | grep -q 'training-old-audit.log'

          echo "Applying the same approved cleanup mutation the Graph would execute..."
          docker compose run --rm --no-deps -T agent python - <<'PY'
          import asyncio

          from agent.mcp_tools import load_tool_catalog


          async def main():
              catalog = await load_tool_catalog()
              result = await catalog.mutating["cleanup_training_logs"].ainvoke(
                  {"service": "tomcat"}
              )
              print("MCP cleanup result:", result)


          asyncio.run(main())
          PY

          test ! -e /tmp/never-used
          if docker compose exec -T tomcat test -e /training-disk/archive/training-old-audit.log; then
            echo "Expected training-old-audit.log to be deleted." >&2
            exit 1
          fi

          after_percent=$(docker compose exec -T tomcat df -Pk /training-disk | awk 'NR==2 {gsub(/%/, "", $5); print $5}')
          echo "training disk use_percent after cleanup=$after_percent"
          test "$after_percent" -lt 50

          echo "Application should recover after old training logs are removed..."
          recovered=0
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 3 http://localhost:8088/api/members >/dev/null 2>&1; then
              recovered=1
              break
            fi
            sleep 1
          done
          test "$recovered" -eq 1


  powershell-disk-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell helper scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/prepare_disk_full_training.ps1",
            "scripts/inject_disk_full.ps1",
            "scripts/battle_inject_fault.ps1",
            "scripts/battle_reset.ps1",
            "scripts/pure_docker_up.ps1",
            "scripts/inject_fault.ps1"
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              exit 1
            }
          }

          Write-Host "PowerShell syntax OK."

      - run: cp .env.example .env

      - name: Start application with bounded Tomcat training disk
        run: docker compose up -d --build postgres tomcat httpd

      - name: Inject disk-full with PowerShell
        shell: pwsh
        run: |
          $healthy = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri "http://localhost:8088/api/members" -TimeoutSec 3
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
            }
            Start-Sleep -Seconds 1
          }

          if (-not $healthy) {
            throw "Application did not become healthy before PowerShell fault injection."
          }

          $env:TARGET_TOMCAT_CONTAINER = (docker compose ps -q tomcat).Trim()
          if ([string]::IsNullOrWhiteSpace($env:TARGET_TOMCAT_CONTAINER)) {
            throw "Could not resolve Tomcat container ID."
          }

          & ./scripts/inject_disk_full.ps1

          try {
            $response = Invoke-WebRequest -UseBasicParsing -Uri "http://localhost:8088/api/members" -TimeoutSec 5
            if ($response.StatusCode -eq 200) {
              throw "Expected HTTP failure after disk-full injection."
            }
          }
          catch {
            if ($_.Exception.Message -eq "Expected HTTP failure after disk-full injection.") {
              throw
            }
            Write-Host "Application failure observed as expected."
          }

      - name: Verify PowerShell injection created the expected fault
        shell: bash
        run: |
          set -euo pipefail
          use_percent=$(docker compose exec -T tomcat df -Pk /training-disk | awk 'NR==2 {gsub(/%/, "", $5); print $5}')
          echo "training disk use_percent=$use_percent"
          test "$use_percent" -ge 95
          docker compose exec -T tomcat test -e /training-disk/archive/training-old-audit.log
          docker compose logs --no-color tomcat | grep -E 'audit_write_failed|No space left on device'

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
