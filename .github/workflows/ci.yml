name: CI

on:
  push:
    branches: ["instructor-ready", "student-complete", "training/team-agent-battle", "training/team-agent-battle-solution", "training/db-disk-full", "training/db-disk-full-solution"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: agent/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r agent/requirements.txt
      - run: python -m compileall -q agent/src
      - run: pytest -q agent/tests

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -q -f member-app/pom.xml package -DskipTests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config >/dev/null
      - run: docker compose build

  web-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start the real web stack
        run: docker compose up -d --build postgres tomcat httpd
      - name: Verify proxy, Servlet, PostgreSQL and recovery
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              echo "===== docker compose ps ====="
              docker compose ps || true
              echo "===== PostgreSQL direct check ====="
              docker compose exec -T postgres psql -U postgres -d memberdb -c 'select id,name,email from members order by id;' || true
              echo "===== HTTP response ====="
              curl -sS -i http://localhost:8088/api/members || true
              echo
              echo "===== Tomcat database failures ====="
              docker compose logs --no-color tomcat 2>&1 | grep -A12 -B4 -E 'Database failure|SQLException|PSQLException|ERROR|Exception' || true
              echo "===== docker compose logs ====="
              docker compose logs --no-color || true
            fi
            docker compose down -v --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT

          echo "Waiting for Browser -> httpd -> Tomcat -> PostgreSQL path..."
          ready=0
          for _ in $(seq 1 30); do
            status=$(curl -sS -o /tmp/members.json -w '%{http_code}' http://localhost:8088/api/members || true)
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            echo "Current HTTP status: $status"
            if [ -s /tmp/members.json ]; then
              echo "Response body:"
              cat /tmp/members.json
              echo
            fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -q 'tanaka@example.local' /tmp/members.json

          echo "Verifying a real CRUD request through httpd and Servlet..."
          curl -fsS \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI User","department":"QA","email":"ci-user@example.local"}' \
            http://localhost:8088/api/members > /tmp/create.json
          curl -fsS http://localhost:8088/api/members > /tmp/members-after-create.json
          grep -q 'ci-user@example.local' /tmp/members-after-create.json

          echo "Verifying that stopping Tomcat is externally observable..."
          docker compose stop tomcat
          sleep 2
          if curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
            echo "Expected application failure after Tomcat stop, but request succeeded." >&2
            exit 1
          fi

          echo "Verifying recovery after Tomcat start..."
          docker compose start tomcat
          recovered=0
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
              recovered=1
              break
            fi
            sleep 2
          done
          test "$recovered" -eq 1

  connection-exhaustion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start normal application stack
        run: docker compose up -d --build postgres tomcat httpd
      - name: Verify connection-exhaustion incident and real MCP remediation
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              echo "===== compose ps ====="
              docker compose --profile fault ps || true
              echo "===== fault injector logs ====="
              docker compose --profile fault logs --no-color fault-injector || true
              echo "===== postgres logs ====="
              docker compose logs --no-color postgres || true
              echo "===== tomcat logs ====="
              docker compose logs --no-color tomcat || true
            fi
            docker compose --profile fault down -v --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT

          echo "Waiting for healthy application..."
          healthy=0
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" -eq 1

          echo "Starting non-superuser connection hog..."
          docker compose --profile fault up -d --build fault-injector

          failed=0
          for _ in $(seq 1 40); do
            if ! curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
              failed=1
              break
            fi
            sleep 1
          done
          test "$failed" -eq 1

          connection_count=$(docker compose exec -T postgres \
            psql -U postgres -d memberdb -Atc \
            "select count(*) from pg_stat_activity where usename='fault_injector' and application_name='fault-injector';")
          echo "fault-injector sessions before MCP remediation: $connection_count"
          test "$connection_count" -ge 10

          echo "Building Agent image and invoking the real MCP tools..."
          docker compose build agent
          docker compose run --rm --no-deps -T agent python - <<'PY'
          import asyncio

          from agent.mcp_tools import load_tool_catalog


          async def main():
              catalog = await load_tool_catalog()
              summary_tool = next(
                  tool for tool in catalog.read_only
                  if tool.name == "get_postgres_connection_summary"
              )
              summary = await summary_tool.ainvoke({})
              print("MCP connection summary:", summary)

              result = await catalog.mutating["terminate_postgres_connections"].ainvoke(
                  {"application_name": "fault-injector"}
              )
              print("MCP remediation result:", result)


          asyncio.run(main())
          PY

          remaining=$(docker compose exec -T postgres \
            psql -U postgres -d memberdb -Atc \
            "select count(*) from pg_stat_activity where usename='fault_injector' and application_name='fault-injector';")
          echo "fault-injector sessions after MCP remediation: $remaining"
          test "$remaining" -eq 0

          echo "The injector stays alive but does not reconnect; application should recover..."
          recovered=0
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:8088/api/members >/dev/null 2>&1; then
              recovered=1
              break
            fi
            sleep 1
          done
          test "$recovered" -eq 1


  db-disk-full-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env

      - name: Start unchanged application with PostgreSQL training storage
        run: docker compose up -d --build postgres tomcat httpd

      - name: Verify read/write split during DB disk-full
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              echo "===== compose ps ====="
              docker compose ps || true
              echo "===== training disk ====="
              docker compose exec -T postgres df -h /training-disk || true
              echo "===== training disk files ====="
              docker compose exec -T postgres sh -c 'du -ak /training-disk 2>/dev/null | sort -nr | head -20' || true
              echo "===== postgres logs ====="
              docker compose logs --no-color postgres || true
              echo "===== tomcat logs ====="
              docker compose logs --no-color tomcat || true
            fi
            docker compose down -v --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT

          echo "Waiting for unchanged CRUD application..."
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 3 http://localhost:8088/api/members >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 3 http://localhost:8088/api/members >/dev/null

          echo "Verifying normal write path before fault..."
          curl -fsS             -X POST             -H 'Content-Type: application/json'             -d '{"name":"Before Fault","department":"training","email":"before-db-disk-full@example.local"}'             http://localhost:8088/api/members > /tmp/before-create.json
          before_id=$(python -c 'import json; print(json.load(open("/tmp/before-create.json"))["id"])')
          curl -fsS -X DELETE "http://localhost:8088/api/members/$before_id" >/dev/null

          echo "Confirming training tablespace is present..."
          docker compose exec -T postgres psql -U postgres -d memberdb -Atc             "select spcname from pg_tablespace where spcname='training_disk_ts';"             | grep -qx training_disk_ts

          echo "Emptying audit relation so the next INSERT must allocate storage..."
          docker compose exec -T postgres psql -U postgres -d memberdb -c             "TRUNCATE training_write_audit;" >/dev/null

          echo "Filling the shared training filesystem with a simulated overnight export..."
          docker compose exec -T postgres sh -c '
            mkdir -p /training-disk/archive
            rm -f /training-disk/archive/training-overnight-export.bin
            dd if=/dev/zero of=/training-disk/archive/training-overnight-export.bin bs=1M count=128 status=none 2>/dev/null || true
            dd if=/dev/zero of=/training-disk/archive/training-overnight-export.bin bs=1K count=4096 oflag=append conv=notrunc status=none 2>/dev/null || true
            dd if=/dev/zero of=/training-disk/archive/training-overnight-export.bin bs=1 count=16384 oflag=append conv=notrunc status=none 2>/dev/null || true
          '

          use_percent=$(docker compose exec -T postgres df -Pk /training-disk | awk 'NR==2 {gsub(/%/, "", $5); print $5}')
          echo "training DB disk use_percent=$use_percent"
          test "$use_percent" -ge 95

          echo "Read path must remain healthy..."
          curl -fsS --max-time 5 http://localhost:8088/api/members >/dev/null

          echo "Existing POST write path must now fail..."
          status=$(curl -sS --max-time 5 -o /tmp/write-failure.json -w '%{http_code}'             -X POST             -H 'Content-Type: application/json'             -d '{"name":"Disk Full","department":"training","email":"during-db-disk-full@example.local"}'             http://localhost:8088/api/members || true)
          echo "POST status=$status"
          cat /tmp/write-failure.json || true
          test "$status" = "500"
          grep -q 'database operation failed' /tmp/write-failure.json

          echo "The failed transaction must not leave the synthetic member behind..."
          remaining=$(docker compose exec -T postgres psql -U postgres -d memberdb -Atc             "select count(*) from members where email='during-db-disk-full@example.local';")
          test "$remaining" -eq 0

  powershell-db-disk-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse DB disk-full PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/prepare_db_disk_full_training.ps1",
            "scripts/inject_db_disk_full.ps1",
            "scripts/battle_inject_fault.ps1",
            "scripts/battle_reset.ps1",
            "scripts/pure_docker_up.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              exit 1
            }
          }
          Write-Host "PowerShell syntax OK."


  db-disk-full-solution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env

      - name: Start unchanged application with PostgreSQL training storage
        run: docker compose up -d --build postgres tomcat httpd

      - name: Verify real MCP observation and remediation
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ]; then
              docker compose ps || true
              docker compose exec -T postgres df -h /training-disk || true
              docker compose exec -T postgres sh -c 'du -ak /training-disk 2>/dev/null | sort -nr | head -20' || true
              docker compose logs --no-color postgres tomcat || true
            fi
            docker compose down -v --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            if curl -fsS --max-time 3 http://localhost:8088/api/members >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8088/api/members >/dev/null

          docker compose exec -T postgres psql -U postgres -d memberdb -c             "TRUNCATE training_write_audit;" >/dev/null

          docker compose exec -T postgres sh -c '
            mkdir -p /training-disk/archive
            rm -f /training-disk/archive/training-overnight-export.bin
            dd if=/dev/zero of=/training-disk/archive/training-overnight-export.bin bs=1M count=128 status=none 2>/dev/null || true
            dd if=/dev/zero of=/training-disk/archive/training-overnight-export.bin bs=1K count=4096 oflag=append conv=notrunc status=none 2>/dev/null || true
            dd if=/dev/zero of=/training-disk/archive/training-overnight-export.bin bs=1 count=16384 oflag=append conv=notrunc status=none 2>/dev/null || true
          '

          status=$(curl -sS --max-time 5 -o /tmp/fail.json -w '%{http_code}'             -X POST             -H 'Content-Type: application/json'             -d '{"name":"Disk Full","department":"training","email":"solution-fail@example.local"}'             http://localhost:8088/api/members || true)
          test "$status" = "500"

          echo "Building Agent and invoking real MCP tools..."
          docker compose build agent

          observation=$(
            docker compose run --rm --no-deps -T agent python - <<'PY'
          import asyncio

          from agent.mcp_tools import load_tool_catalog


          async def main():
              catalog = await load_tool_catalog()
              read_tools = {tool.name: tool for tool in catalog.read_only}

              usage = await read_tools["get_postgres_training_disk_usage"].ainvoke(
                  {"service": "postgres"}
              )
              files = await read_tools["list_postgres_training_disk_files"].ainvoke(
                  {"service": "postgres", "limit": 10}
              )
              print("DISK_USAGE", usage)
              print("LARGE_FILES", files)


          asyncio.run(main())
          PY
          )
          echo "$observation"
          echo "$observation" | grep -q 'training-overnight-export.bin'
          echo "$observation" | grep -Eq "use_percent['\"]?:? ?(9[5-9]|100)"

          echo "Applying approved cleanup mutation..."
          docker compose run --rm --no-deps -T agent python - <<'PY'
          import asyncio

          from agent.mcp_tools import load_tool_catalog


          async def main():
              catalog = await load_tool_catalog()
              result = await catalog.mutating[
                  "cleanup_postgres_training_exports"
              ].ainvoke({"service": "postgres"})
              print("MCP cleanup result:", result)


          asyncio.run(main())
          PY

          if docker compose exec -T postgres test -e /training-disk/archive/training-overnight-export.bin; then
            echo "Expected training export to be deleted." >&2
            exit 1
          fi

          echo "GET remains healthy and write path must recover..."
          curl -fsS http://localhost:8088/api/members >/dev/null
          curl -fsS             -X POST             -H 'Content-Type: application/json'             -d '{"name":"Recovered","department":"training","email":"solution-recovered@example.local"}'             http://localhost:8088/api/members > /tmp/recovered.json
          recovered_id=$(python -c 'import json; print(json.load(open("/tmp/recovered.json"))["id"])')
          curl -fsS -X DELETE "http://localhost:8088/api/members/$recovered_id" >/dev/null
